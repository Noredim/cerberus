<!doctype html>
<html lang="pt-BR" translate="no" class="notranslate">

<head>
  <meta charset="UTF-8" />
  <meta name="google" content="notranslate" />
  <link rel="icon" type="image/png" href="/cerberus-logo.png" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#0F172A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cerberus" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://img.youtube.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100..900;1,100..900&display=optional">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100..900;1,100..900&display=optional"
    rel="stylesheet" media="print" onload="this.media='all'">
  <noscript>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:ital,wght@0,100..900;1,100..900&display=optional"
      rel="stylesheet">
  </noscript>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cerberus — Motor de Vendas & Inteligência Tributária</title>
  <meta name="description"
    content="Cerberus é um motor premium para vendas, engenharia de custos e gestão de tributos municipais." />
  <meta property="og:title" content="Cerberus — Motor de Vendas & Inteligência Tributária" />
  <meta property="og:description"
    content="Motor de vendas premium para engenharia de custos, precificação e inteligência tributária municipal." />
  <meta property="og:type" content="website" />
  <meta property="og:image" content="/cerberus-logo.png" />
  <script>
    (function(){
      try {
        var p = window.location.pathname;
        if (p && p.indexOf('/lp/') === 0) {
          var s = p.split('/')[2];
          if (s) {
            if (s === 'stelsegvision') {
              var l = document.createElement('link');
              l.rel = 'preload';
              l.as = 'image';
              l.href = 'https://img.youtube.com/vi/xVQnt2qD7VY/hqdefault.jpg';
              l.fetchPriority = 'high';
              document.head.appendChild(l);
            }
            window.__MKT_LP_PRELOAD__ = fetch('/api/marketing/public/resolve?domain=' + encodeURIComponent(window.location.host) + '&slug=' + encodeURIComponent(s))
              .then(function(res){ return res.ok ? res.json() : null; })
              .then(function(data){
                if (data) {
                  window.__MKT_LP_DATA__ = data;
                  var v = data.url_video;
                  var imgUrl = null;
                  if (v) {
                    var m = v.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/);
                    if (m && m[1]) {
                      imgUrl = 'https://img.youtube.com/vi/' + m[1] + '/hqdefault.jpg';
                    }
                  } else if (data.url_imagem_banner) {
                    imgUrl = data.url_imagem_banner;
                  }
                  if (imgUrl && !document.querySelector('link[href="' + imgUrl + '"]')) {
                    var link = document.createElement('link');
                    link.rel = 'preload';
                    link.as = 'image';
                    link.href = imgUrl;
                    link.fetchPriority = 'high';
                    document.head.appendChild(link);
                  }
                }
                return data;
              })
              .catch(function(){ return null; });
          }
        }
      } catch(e){}
    })();
  </script>
</head>

<body>
  <div id="root">
    <style>
      .initial-app-shell { min-height: 100vh; background-color: #020617; color: #ffffff; display: flex; flex-direction: column; font-family: system-ui, -apple-system, sans-serif; }
      .initial-header { height: 56px; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: space-between; padding: 0 1.5rem; }
      .initial-logo { font-size: 0.9rem; font-weight: 700; color: #f8fafc; letter-spacing: 0.05em; }
    </style>
    <div class="initial-app-shell">
      <div class="initial-header">
        <span class="initial-logo">CERBERUS</span>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
